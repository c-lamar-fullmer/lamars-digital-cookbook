# ===============================================================
# PRODUCTION PROFILE
# ===============================================================
# This file is loaded ONLY when SPRING_PROFILES_ACTIVE=prod is set
# (that's what you'll set in Render's environment variables).
#
# It contains NO real secrets — every value below is a placeholder
# that Spring Boot fills in from actual environment variables at
# runtime. That's what makes this file safe to commit to GitHub,
# unlike your local application.properties.
#
# Your local application.properties (gitignored, real values) is
# completely unaffected by this file — when you run the app locally
# with no profile active, this file is never loaded at all.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate needs this set explicitly in production — unlike your
# local setup, there's no application.properties file bundled in
# the deployed image with this already defined, so without this
# line Spring Boot's default ("none") would mean your tables never
# get created on a fresh database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Render assigns a dynamic port via the PORT environment variable —
# your app MUST listen on whatever port Render provides, not a
# hardcoded 8080. The :8080 fallback only matters if PORT is ever
# unset, which won't happen on Render itself.
server.port=${PORT:8080}

admin.password=${ADMIN_PASSWORD}
